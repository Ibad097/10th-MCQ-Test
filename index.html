<html lang="en">
<head>

    <title>SST MCQ Test</title>
    <style>
        :root {
            --primary: #3498db;
            --primary-hover: #2980b9;
            --success: #2ecc71;
            --success-hover: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-dark);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            position: relative;
        }

        h1 {
            text-align: center;
            color: var(--text-dark);
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 2.2em;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-back {
            background: #e2e8f0;
            color: #475569;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: none;
            transition: all 0.2s;
        }

        .btn-back:hover {
            background: #cbd5e1;
        }

        /* Subject Grid (Screen 1) */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .subject-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .subject-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.15);
        }

        .subject-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .subject-title {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* Lesson List (Screen 2) */
        .lesson-list {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .lesson-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .lesson-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f0f7ff;
            transform: translateX(4px);
        }

        /* Grayed out state for empty lessons */
        .lesson-btn:disabled {
            background: #f1f5f9;
            color: #94a3b8;
            border-color: #e2e8f0;
            cursor: not-allowed;
        }

        .badge {
            font-size: 0.75em;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--primary);
            color: white;
            font-weight: bold;
        }

        .badge.empty {
            background: #cbd5e1;
            color: #475569;
        }

        /* Setup & Quiz Screens */
        .setup-screen { display: none; text-align: center; }
        .setup-screen h3 { font-size: 1.5em; margin-bottom: 10px; }
        #totalFoundText { color: var(--text-muted); font-weight: 500; margin-bottom: 25px; }

        .select-style {
            padding: 12px 16px;
            font-size: 1em;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            margin-bottom: 25px;
            width: 100%;
            max-width: 300px;
            outline: none;
            cursor: pointer;
        }

        .btn-main {
            padding: 14px 40px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            display: block;
        }
        .btn-main:hover { background: var(--primary-hover); transform: translateY(-2px); }

        .progress-bar-container {
            background: #e2e8f0;
            height: 10px;
            border-radius: 5px;
            margin: 20px 0 10px 0;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, var(--primary), var(--success));
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }
        .status-text { text-align: right; font-size: 0.9em; font-weight: 600; color: var(--text-muted); margin-bottom: 20px; }

        /* Quiz Options */
        .question-text { font-weight: 700; font-size: 1.3em; margin-bottom: 20px; line-height: 1.4; }
        .options-container { display: flex; flex-direction: column; gap: 12px; }
        
        .option-label {
            display: flex; align-items: center; gap: 14px;
            padding: 16px; border: 2px solid #e2e8f0; border-radius: 10px;
            cursor: pointer; font-weight: 500; transition: all 0.2s;
        }
        .option-label:hover { background: #f8fafc; border-color: #cbd5e1; }
        
        input[type="radio"] {
            appearance: none; width: 22px; height: 22px; border: 2px solid #cbd5e1;
            border-radius: 50%; display: grid; place-content: center; cursor: pointer;
        }
        input[type="radio"]::before {
            content: ""; width: 12px; height: 12px; border-radius: 50%;
            transform: scale(0); transition: 120ms transform ease-in-out;
            background-color: var(--primary);
        }
        input[type="radio"]:checked::before { transform: scale(1); }
        input[type="radio"]:checked { border-color: var(--primary); }

        .correct-ans { background: var(--success) !important; color: white !important; border-color: var(--success-hover) !important; }
        .correct-ans input[type="radio"]::before { background-color: white; }
        .correct-ans input[type="radio"] { border-color: white; }

        .wrong-ans { background: var(--danger) !important; color: white !important; border-color: #c0392b !important; }
        .wrong-ans input[type="radio"]::before { background-color: white; }
        .wrong-ans input[type="radio"] { border-color: white; }
        
        .disable-click { pointer-events: none; }

        .nav-actions { display: flex; justify-content: space-between; margin-top: 30px; gap: 15px; }
        .btn-nav { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1em; color: white; transition: 0.2s; }
        #skipBtn { background: var(--warning); }
        #skipBtn:hover:not(:disabled) { background: #d35400; }
        #skipBtn:disabled { background: #e2e8f0 !important; color: #94a3b8; cursor: not-allowed; }
        #nextBtn { background: var(--primary); }
        #nextBtn:hover:not(:disabled) { background: var(--primary-hover); }
        #nextBtn:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }

        /* Results */
        .result-box { display: none; text-align: center; padding: 20px 0; }
        .result-box h2 { font-size: 2em; margin-bottom: 10px; }
        .result-box h3 { color: var(--text-muted); margin-bottom: 30px; }

        @media (max-width: 600px) {
            .container { padding: 20px; border-radius: 12px; }
            h1 { font-size: 1.8em; }
            .nav-actions { flex-direction: column; }
        }
    </style>
</head>

                { name: "Lesson 2: Sectors of the Indian Economy", data: `` },
                { name: "Disaster Management", data: `` },
                { name: "Road Safety", data: `` }
            ]
        }
    };

    // =====================================================================
    // APPLICATION LOGIC
    // =====================================================================

    let currentQuizSource = "";
    let globalParsedBank = [];
    let activeQuizBank = [];
    let retryBank = []; // Tracks questions missed or skipped
    let currentQuestionIndex = 0;
    let score = 0;
    let currentScreen = "home"; 

    // Initialize Home Screen
    function init() {
        const subjectScreen = document.getElementById('subjectScreen');
        subjectScreen.innerHTML = '';
        
        for (const [key, subject] of Object.entries(quizDatabases)) {
            const card = document.createElement('div');
            card.className = 'subject-card';
            card.onclick = () => showLessons(key);
            card.innerHTML = `
                <div class="subject-icon">${subject.icon}</div>
                <div class="subject-title">${subject.title}</div>
            `;
            subjectScreen.appendChild(card);
        }
        navigate("home");
    }

    function showLessons(subjectKey) {
        const subject = quizDatabases[subjectKey];
        const lessonScreen = document.getElementById('lessonScreen');
        document.getElementById('mainTitle').innerText = `${subject.icon} ${subject.title}`;
        lessonScreen.innerHTML = '';

        subject.lessons.forEach((lesson, index) => {
            const hasData = lesson.data.trim().length > 0;
            const btn = document.createElement('button');
            btn.className = 'lesson-btn';
            btn.disabled = !hasData;
            
            btn.innerHTML = `
                <span>${lesson.name}</span>
                <span class="badge ${hasData ? '' : 'empty'}">${hasData ? 'Ready' : 'No Data'}</span>
            `;

            if (hasData) {
                btn.onclick = () => prepareSetupScreen(lesson.data, lesson.name);
            }
            lessonScreen.appendChild(btn);
        });

        navigate("lessons");
    }

    function prepareSetupScreen(rawTextData, title) {
        document.getElementById('mainTitle').innerText = "Quiz Setup";
        document.getElementById('setupLessonTitle').innerText = title;
        currentQuizSource = rawTextData;
        
        if(parseData()) {
            navigate("setup");
        }
    }

    function parseData() {
        const blocks = currentQuizSource.trim().split(/\r?\n\s*\r?\n/);
        globalParsedBank = [];

        blocks.forEach(block => {
            const lines = block.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);
            if (lines.length < 2) return;
            const question = lines[0];
            const correctAnswer = lines[1];
            
            let options = [...lines.slice(1)];
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            globalParsedBank.push({ question, options, correctAnswer });
        });

        const totalQuestions = globalParsedBank.length;
        if (totalQuestions === 0) {
            alert("No valid questions parsed from this layout! Ensure there are no extra blank lines between options.");
            return false;
        }

        document.getElementById('totalFoundText').innerText = `Total questions available: ${totalQuestions}`;

        const divisors = [10, 4, 2, 1];
        let structuralOptions = []; 
        divisors.forEach(div => {
            let val = Math.floor(totalQuestions / div);
            if (val > 0) structuralOptions.push(val);
        });

        let uniqueOptions = [...new Set(structuralOptions)].sort((a, b) => a - b);
        const selectDropdown = document.getElementById('quantitySelect');
        selectDropdown.innerHTML = '';
        
        uniqueOptions.forEach(count => {
            let labelText = (count === totalQuestions) ? `All (${count} Questions)` : `${count} Questions`;
            let optElem = document.createElement('option');
            optElem.value = count;
            optElem.innerText = labelText;
            selectDropdown.appendChild(optElem);
        });
        
        selectDropdown.value = totalQuestions;
        return true;
    }

    function startQuizGameplay() {
        const selectedCount = parseInt(document.getElementById('quantitySelect').value);
        
        let tempBank = [...globalParsedBank];
        for (let i = tempBank.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [tempBank[i], tempBank[j]] = [tempBank[j], tempBank[i]];
        }
        activeQuizBank = tempBank.slice(0, selectedCount);

        currentQuestionIndex = 0;
        score = 0;
        retryBank = []; // Reset retry bank on fresh run
        navigate("quiz");
        showQuestion();
    }

    // New start function purely for retrying mistakes/skips
    function startRetryGameplay() {
        activeQuizBank = [...retryBank]; // Replace active questions with the ones we got wrong
        currentQuestionIndex = 0;
        score = 0;
        retryBank = []; // Reset the retry bank for THIS attempt
        navigate("quiz");
        showQuestion();
    }

    function showQuestion() {
        const container = document.getElementById('dynamicQuestionBox');
        const item = activeQuizBank[currentQuestionIndex];
        
        document.getElementById('statusText').innerText = `Question ${currentQuestionIndex + 1} of ${activeQuizBank.length}`;
        const progressPercent = (currentQuestionIndex / activeQuizBank.length) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;
        
        const nextBtn = document.getElementById('nextBtn');
        nextBtn.disabled = true;
        document.getElementById('skipBtn').disabled = false;
        nextBtn.innerText = (currentQuestionIndex === activeQuizBank.length - 1) ? "Finish Quiz" : "Next Question";

        let optionsHTML = '';
        item.options.forEach((opt, oIdx) => {
            optionsHTML += `
                <label class="option-label">
                    <input type="radio" name="current_opts" value="${opt.replace(/"/g, '&quot;')}" onclick="checkAnswer(this)">
                    <span>${opt}</span>
                </label>
            `;
        });

        container.innerHTML = `
            <div>
                <div class="question-text">${item.question}</div>
                <div class="options-container" id="optionsGroup">${optionsHTML}</div>
            </div>
        `;
    }

    function checkAnswer(selectedRadio) {
        document.getElementById('skipBtn').disabled = true;
        const item = activeQuizBank[currentQuestionIndex];
        const optionsGroup = document.getElementById('optionsGroup');
        const labels = optionsGroup.getElementsByClassName('option-label');

        optionsGroup.classList.add('disable-click');

        for (let label of labels) {
            const radioInput = label.querySelector('input');
            if (radioInput.value === item.correctAnswer) {
                label.classList.add('correct-ans');
            } else if (radioInput.checked) {
                label.classList.add('wrong-ans');
            }
        }

        if (selectedRadio.value === item.correctAnswer) {
            score++;
        } else {
            retryBank.push(item); // They got it wrong, add to retry bank
        }

        document.getElementById('nextBtn').disabled = false;
    }

    function skipQuestion() {
        const optionsGroup = document.getElementById('optionsGroup');
        if (optionsGroup && optionsGroup.classList.contains('disable-click')) return;

        // They skipped it, so add to retry bank and move on
        retryBank.push(activeQuizBank[currentQuestionIndex]);
        
        if (currentQuestionIndex < activeQuizBank.length - 1) {
            currentQuestionIndex++;
            showQuestion();
        } else {
            finishQuiz();
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < activeQuizBank.length - 1) {
            currentQuestionIndex++;
            showQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        document.getElementById('progressFill').style.width = '100%';
        const resBox = document.getElementById('resultBox');
        
        const percentage = Math.round((score / activeQuizBank.length) * 100);
        
        // Generate the Retry Button if they missed or skipped anything
        let retryButtonHTML = '';
        if(retryBank.length > 0) {
            retryButtonHTML = `
                <button class="btn-main" style="background: var(--warning); margin-bottom: 15px;" onclick="startRetryGameplay()">
                    🔄 Retry Incorrect/Skipped (${retryBank.length})
                </button>
            `;
        }

        resBox.innerHTML = `
            <h2>🎉 Quiz Completed!</h2>
            <h3>Your Final Score: ${score} / ${activeQuizBank.length} (${percentage}%)</h3>
            ${retryButtonHTML}
            <button class="btn-main" style="background: var(--text-muted);" onclick="init()">🔙 Back to Main Menu</button>
        `;
        navigate("results");
    }

    // Easy Screen Management
    function navigate(screen) {
        currentScreen = screen;
        document.getElementById('subjectScreen').style.display = screen === 'home' ? 'grid' : 'none';
        document.getElementById('lessonScreen').style.display = screen === 'lessons' ? 'flex' : 'none';
        document.getElementById('setupScreen').style.display = screen === 'setup' ? 'block' : 'none';
        document.getElementById('quizApp').style.display = screen === 'quiz' ? 'block' : 'none';
        document.getElementById('resultBox').style.display = screen === 'results' ? 'block' : 'none';

        // Manage Header Back Button & Titles
        const backBtn = document.getElementById('backBtn');
        if (screen === 'home') {
            backBtn.style.display = 'none';
            document.getElementById('mainTitle').innerText = "SST MCQ Test";
        } else if (screen === 'lessons') {
            backBtn.style.display = 'block';
        } else if (screen === 'setup') {
            backBtn.style.display = 'block';
        } else {
            backBtn.style.display = 'none';
        }
    }

            // Initialize the audio context
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(isCorrect) {
            // Browsers require audio context to be resumed after user interaction
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (isCorrect) {
                // Correct Sound: A low, soft, pleasant chime (Sine wave)
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(400, now); 
                oscillator.frequency.exponentialRampToValueAtTime(600, now + 0.1); 
                
                // Volume envelope (low volume: 0.1)
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.1, now + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                
                oscillator.start(now);
                oscillator.stop(now + 0.5);
            } else {
                // Wrong Sound: A dull, descending sound (Triangle wave)
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(250, now);
                oscillator.frequency.exponentialRampToValueAtTime(150, now + 0.2); 
                
                // Volume envelope (low volume: 0.1)
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.1, now + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                
                oscillator.start(now);
                oscillator.stop(now + 0.4);
            }
        }

    function goBack() {
        if (currentScreen === 'lessons') init();
        else if (currentScreen === 'setup') document.getElementById('backBtn').onclick = () => init(); 
        init(); // Default fallback
    }

    // Run on boot
    init();

</script>
